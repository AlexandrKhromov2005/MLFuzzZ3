# SPDX-License-Identifier: MIT
# The shared log section keeps its existing semantics.
log:
  level: info
  format: text
composition:
  schema_version: 1
  profile: hybrid-heuristic
  seed: 1234
  seed_scheduler:
    type: random
  strategy_policy:
    type: stagnation
  stages:
    - type: deterministic
    - type: mutation
      mutator: havoc
      # operators: [flip1, byte, insert, duplicate, delete]
    - type: i2s
      binding: value_match
      allow_incomplete: false
    - type: i2s_smt
      binding: value_match
      solver: z3
      timeout_ms: 1000
      allow_incomplete: false
  admission:
    type: coverage_novelty
  campaign:
    max_iterations: 10000
    max_seconds: 0
    max_det_steps: 65536
    stagnation_threshold: 64
    min_exec_interval: 0
    adaptive_throttle: true
